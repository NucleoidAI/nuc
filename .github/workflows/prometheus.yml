name: Prometheus
on:
  push:
    branches: [main]
    paths:
      - 'monitoring/prometheus/**'
      - '.github/workflows/prometheus.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - land
        default: 'land'

jobs:
  prometheus:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: prometheus
      environment: land
      context_path: ./monitoring/prometheus
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      DOCKER_USERNAME: canmingir