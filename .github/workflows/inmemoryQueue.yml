name: InMemoryQueue
on:
  push:
    branches: [main]
    paths:
      - "inMemoryEventListener/**"
      - ".github/workflows/inmemoryQueue.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  inmemoryQueue:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: inmemory-queue
      environment: "land"
      context_path: ./inMemoryEventListener
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      DOCKER_USERNAME: canmingir
