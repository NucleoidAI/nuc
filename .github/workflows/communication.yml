name: Communication
on:
  push:
    branches: [main]
    paths:
      - "communication/**"
      - ".github/workflows/communication.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - land
        default: "land"
jobs:
  communication:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: communication
      environment: land
      context_path: ./communication
      install_dependencies: true
      dependency_path: communication
      config_paths: "./communication"
      setup_config: true
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      DOCKER_USERNAME: canmingir
