name: greycollar-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-greycollar
    restart: unless-stopped
    environment:
      - POSTGRES_USER=greyadmin
      - POSTGRES_PASSWORD=eyuTSfZ4vJmxWfDz
      - POSTGRES_DB=greycollar-land
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - traefik-network
    ports:
      - '5432:5432'
    labels:
      - 'traefik.enable=true'
      - 'traefik.tcp.routers.postgres.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.postgres.entrypoints=postgres'
      - 'traefik.tcp.routers.postgres.service=postgres'
      - 'traefik.tcp.services.postgres.loadbalancer.server.port=5432'
      - 'traefik.http.routers.postgres-http.rule=Host(`postgres.greycollar.ai`)'
      - 'traefik.http.routers.postgres-http.entrypoints=websecure'
      - 'traefik.http.routers.postgres-http.tls=true'
      - 'traefik.http.routers.postgres-http.tls.certresolver=default'

  watcher:
    image: halilcengel/watcher:latest
    container_name: watcher
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ~/.docker/config.json:/root/.docker/config.json:ro
    environment:
      WATCHER_COMPOSE_FILE: /docker-compose.yml
      WATCHER_POLL_INTERVAL: 1m
      WATCHER_LOG_LEVEL: info
      WATCHER_RETRY_ATTEMPTS: 3
      DOCKER_API_VERSION: "1.44"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - traefik-network
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.elasticsearch.rule=Host(`elasticsearch.greycollar.ai`)'
      - 'traefik.http.routers.elasticsearch.entrypoints=websecure'
      - 'traefik.http.routers.elasticsearch.tls=true'
      - 'traefik.http.routers.elasticsearch.tls.certresolver=default'
      - 'traefik.http.services.elasticsearch.loadbalancer.server.port=9200'
      - 'traefik.http.routers.elasticsearch-http.rule=Host(`elasticsearch.greycollar.ai`)'
      - 'traefik.http.routers.elasticsearch-http.entrypoints=web'
      - 'traefik.http.routers.elasticsearch-http.middlewares=redirect-to-https'

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=https://kibana.greycollar.ai
    ports:
      - "5601:5601"
    networks:
      - traefik-network
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.kibana.rule=Host(`kibana.greycollar.ai`)'
      - 'traefik.http.routers.kibana.entrypoints=websecure'
      - 'traefik.http.routers.kibana.tls=true'
      - 'traefik.http.routers.kibana.tls.certresolver=default'
      - 'traefik.http.services.kibana.loadbalancer.server.port=5601'
      - 'traefik.http.routers.kibana-http.rule=Host(`kibana.greycollar.ai`)'
      - 'traefik.http.routers.kibana-http.entrypoints=web'
      - 'traefik.http.routers.kibana-http.middlewares=redirect-to-https'

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root
    restart: unless-stopped
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
      - app-logs:/var/log/apps:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: filebeat -e -strict.perms=false

  pushgateway-land:
    image: prom/pushgateway:latest
    container_name: pushgateway-land
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pushgateway-land.rule=Host(`pushgateway.land.greycollar.ai`)'
      - 'traefik.http.routers.pushgateway-land.entrypoints=websecure'
      - 'traefik.http.routers.pushgateway-land.tls=true'
      - 'traefik.http.routers.pushgateway-land.tls.certresolver=default'
      - 'traefik.http.services.pushgateway-land.loadbalancer.server.port=9091'
      - 'traefik.http.routers.pushgateway-land-http.rule=Host(`pushgateway.land.greycollar.ai`)'
      - 'traefik.http.routers.pushgateway-land-http.entrypoints=web'
      - 'traefik.http.routers.pushgateway-land-http.middlewares=redirect-to-https'

  prometheus-land:
    image: canmingir/prometheus-land:latest
    container_name: prometheus-land
    restart: unless-stopped
    networks:
      - traefik-network
    volumes:
      - prometheus-land-data:/prometheus
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.prometheus-land.rule=Host(`prometheus.land.greycollar.ai`)'
      - 'traefik.http.routers.prometheus-land.entrypoints=websecure'
      - 'traefik.http.routers.prometheus-land.tls=true'
      - 'traefik.http.routers.prometheus-land.tls.certresolver=default'
      - 'traefik.http.services.prometheus-land.loadbalancer.server.port=9090'
      - 'traefik.http.routers.prometheus-land-http.rule=Host(`prometheus.land.greycollar.ai`)'
      - 'traefik.http.routers.prometheus-land-http.entrypoints=web'
      - 'traefik.http.routers.prometheus-land-http.middlewares=redirect-to-https'

  grafana-land:
    image: canmingir/grafana-land:latest
    container_name: grafana-land
    restart: unless-stopped
    networks:
      - traefik-network
    volumes:
      - grafana-land-data:/var/lib/grafana
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana-land.rule=Host(`grafana.land.greycollar.ai`)'
      - 'traefik.http.routers.grafana-land.entrypoints=websecure'
      - 'traefik.http.routers.grafana-land.tls=true'
      - 'traefik.http.routers.grafana-land.tls.certresolver=default'
      - 'traefik.http.services.grafana-land.loadbalancer.server.port=3000'
      - 'traefik.http.routers.grafana-land-http.rule=Host(`grafana.land.greycollar.ai`)'
      - 'traefik.http.routers.grafana-land-http.entrypoints=web'
      - 'traefik.http.routers.grafana-land-http.middlewares=redirect-to-https'

  communication-land:
    image: canmingir/communication-land:latest
    container_name: communication-land
    restart: unless-stopped
    networks:
      - traefik-network
    env_file:
      - /home/ubuntu/apps/env/env.communication.land
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.communication-land.rule=Host(`communication.land.greycollar.ai`)'
      - 'traefik.http.routers.communication-land.entrypoints=websecure'
      - 'traefik.http.routers.communication-land.tls=true'
      - 'traefik.http.routers.communication-land.tls.certresolver=default'
      - 'traefik.http.services.communication-land.loadbalancer.server.port=3003'
      - 'traefik.http.routers.communication-land-http.rule=Host(`communication.land.greycollar.ai`)'
      - 'traefik.http.routers.communication-land-http.entrypoints=web'
      - 'traefik.http.routers.communication-land-http.middlewares=redirect-to-https'

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./acme.json:/acme.json
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tls.yml:/tls.yml:ro
      - ./traefik.yml:/traefik.yml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true'

  nucleoid-com-website:
    image: canmingir/nucleoid.com-live:latest
    container_name: nucleoid-com-website
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nucleoid-com-website.rule=Host(`website.nucleoid.com`)'
      - 'traefik.http.routers.nucleoid-com-website.entrypoints=websecure'
      - 'traefik.http.routers.nucleoid-com-website.tls=true'
      - 'traefik.http.routers.nucleoid-com-website.tls.certresolver=default'
      - 'traefik.http.services.nucleoid-com-website.loadbalancer.server.port=3000'
      - 'traefik.http.routers.nucleoid-com-website-http.rule=Host(`website.nucleoid.com`)'
      - 'traefik.http.routers.nucleoid-com-website-http.entrypoints=web'
      - 'traefik.http.routers.nucleoid-com-website-http.middlewares=redirect-to-https'

  nucleoid-ai-website:
    image: canmingir/nucleoid.ai-live:latest
    container_name: nucleoid-ai-website
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nucleoid-ai-website.rule=Host(`website.nucleoid.ai`)'
      - 'traefik.http.routers.nucleoid-ai-website.entrypoints=websecure'
      - 'traefik.http.routers.nucleoid-ai-website.tls=true'
      - 'traefik.http.routers.nucleoid-ai-website.tls.certresolver=default'
      - 'traefik.http.services.nucleoid-ai-website.loadbalancer.server.port=3000'
      - 'traefik.http.routers.nucleoid-ai-website-http.rule=Host(`website.nucleoid.ai`)'
      - 'traefik.http.routers.nucleoid-ai-website-http.entrypoints=web'
      - 'traefik.http.routers.nucleoid-ai-website-http.middlewares=redirect-to-https'

  nucleoid-docs:
