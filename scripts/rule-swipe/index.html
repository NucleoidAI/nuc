<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rule Swipe</title>
<script>
try {
  const savedTheme = localStorage.getItem("rule-swipe:theme");

  if (savedTheme === "light" || savedTheme === "dark") {
    document.documentElement.dataset.theme = savedTheme;
  }
} catch (error) {
  document.documentElement.removeAttribute("data-theme");
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #17202a;
  --muted: #5a6776;
  --line: #d6dce3;
  --accent: #2446c4;
  --accent-ink: #ffffff;
  --ok: #1b8a4c;
  --ok-soft: #e3f4ea;
  --bad: #c6352b;
  --bad-soft: #fbe7e5;
  --claim-good: #1d6c88;
  --claim-good-soft: #e2f1f6;
  --claim-bad: #a85a0c;
  --claim-bad-soft: #fbf0e2;
  --code-bg: #f3f5f8;
  --hl-key: #a1307a;
  --hl-str: #1d7a4a;
  --hl-num: #a85a0c;
  --hl-fn: #2446c4;
  --hl-type: #1d6c88;
  --hl-com: #7a8693;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06), 0 12px 32px -12px rgba(23, 32, 42, .18);
  --font-ui: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --on-verdict: #ffffff;
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319;
    --surface: #161d25;
    --surface-2: #1c252f;
    --ink: #e5eaf0;
    --muted: #94a1af;
    --line: #2a3541;
    --accent: #8098ff;
    --accent-ink: #0e1319;
    --ok: #43c17d;
    --ok-soft: #15301f;
    --bad: #f2695e;
    --bad-soft: #3a1c1a;
    --claim-good: #62bad8;
    --claim-good-soft: #13303a;
    --claim-bad: #e8a352;
    --claim-bad-soft: #36260f;
    --code-bg: #11181f;
    --hl-key: #e98bc6;
    --hl-str: #7fd3a0;
    --hl-num: #e8a352;
    --hl-fn: #9aaeff;
    --hl-type: #62bad8;
    --hl-com: #6f7d8b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
    --on-verdict: #0e1319;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319;
  --surface: #161d25;
  --surface-2: #1c252f;
  --ink: #e5eaf0;
  --muted: #94a1af;
  --line: #2a3541;
  --accent: #8098ff;
  --accent-ink: #0e1319;
  --ok: #43c17d;
  --ok-soft: #15301f;
  --bad: #f2695e;
  --bad-soft: #3a1c1a;
  --claim-good: #62bad8;
  --claim-good-soft: #13303a;
  --claim-bad: #e8a352;
  --claim-bad-soft: #36260f;
  --code-bg: #11181f;
  --hl-key: #e98bc6;
  --hl-str: #7fd3a0;
  --hl-num: #e8a352;
  --hl-fn: #9aaeff;
  --hl-type: #62bad8;
  --hl-com: #6f7d8b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
  --on-verdict: #0e1319;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
button, input, textarea, select { font: inherit; color: inherit; }
code, pre { font-family: var(--font-code); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  letter-spacing: -.01em;
  font-size: 17px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  white-space: nowrap;
}
.brand-mark { display: inline-flex; position: relative; width: 26px; height: 22px; }
.brand-mark span {
  position: absolute;
  width: 17px;
  height: 21px;
  border-radius: 4px;
  border: 2px solid var(--ink);
  background: var(--surface);
}
.brand-mark span:first-child { left: 0; top: 1px; transform: rotate(-12deg); border-color: var(--bad); }
.brand-mark span:last-child { right: 0; top: 0; transform: rotate(10deg); border-color: var(--ok); }
.topbar-doc {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}
.topbar-doc .doc-name {
  font-family: var(--font-code);
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.persist {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.persist::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.persist[data-kind="api"]::before { background: var(--ok); }
.persist[data-kind="sample"]::before { background: var(--claim-bad); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn-quiet:hover { color: var(--ink); border-color: var(--line); }
kbd {
  font-family: var(--font-code);
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  color: var(--muted);
  background: var(--surface-2);
}

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}

.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.home-intro h1 {
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.08;
  letter-spacing: -.025em;
  font-weight: 800;
  margin: 0 0 12px;
  text-wrap: balance;
}
.home-intro p { color: var(--muted); max-width: 52ch; margin: 0 0 20px; }
.legend { display: grid; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; font-size: 14px; }
.legend li { display: flex; gap: 10px; align-items: baseline; }
.legend .arrow { font-family: var(--font-code); font-weight: 600; min-width: 2.2em; }
.legend .arrow.ok { color: var(--ok); }
.legend .arrow.bad { color: var(--bad); }
.legend .arrow.neutral { color: var(--muted); }

.drop {
  display: grid;
  place-items: center;
  gap: 10px;
  text-align: center;
  padding: 28px 20px;
  border: 2px dashed var(--line);
  border-radius: 14px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); }
.drop.over { background: var(--surface-2); }
.drop strong { font-size: 16px; }
.drop small { color: var(--muted); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.saved { margin-top: 28px; }
.eyebrow {
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin: 0 0 10px;
}
.saved-list { display: grid; gap: 8px; }
.saved-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
}
.saved-item:hover { border-color: var(--accent); }
.saved-item .name { font-family: var(--font-code); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-item .meta { grid-column: 1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.saved-item .go { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; color: var(--accent); font-weight: 700; }
.mini-progress { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; display: flex; }
.mini-progress i { display: block; height: 100%; }
.empty-note { color: var(--muted); font-size: 14px; margin: 0; }

.preview-wrap { position: relative; }
.preview-tag {
  position: absolute;
  top: -10px;
  right: 14px;
  z-index: 2;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--claim-bad-soft);
  color: var(--claim-bad);
  border: 1px solid currentColor;
}
.preview-wrap .card { max-height: none; transform: rotate(1.2deg); }
.saved-group { display: grid; gap: 8px; }
.saved-group + .saved-group { margin-top: 18px; }
.preview-actions { display: flex; justify-content: center; margin-top: 18px; }

.review {
  max-width: 820px;
  margin: 0 auto;
  height: calc(100dvh - var(--header-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 12px;
}
.review-bar { display: grid; gap: 10px; }
.review-bar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.counts { display: flex; gap: 14px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); flex-wrap: wrap; }
.counts b { color: var(--ink); font-weight: 700; }
.counts .c-ok b { color: var(--ok); }
.counts .c-bad b { color: var(--bad); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; transition: width .25s; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.seg button {
  border: 0;
  background: transparent;
  padding: 5px 10px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 700; }

.stack { position: relative; flex: 1; min-height: 0; }
.ghost {
  position: absolute;
  inset: 10px 14px -8px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  opacity: .6;
}
.card {
  position: relative;
  height: 100%;
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}
.card.dragging { cursor: grabbing; }
.card.snap { transition: transform .22s ease; }
.card-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.crumb { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.rule-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rule-id { font-size: 15px; font-weight: 600; word-break: break-all; }
.sev {
  font-family: var(--font-code);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
  color: var(--muted);
  text-transform: lowercase;
}
.sev-error { color: var(--bad); border-color: currentColor; }
.sev-warn { color: var(--claim-bad); border-color: currentColor; }
.statement { margin: 0; font-size: 15.5px; font-weight: 500; max-width: 70ch; }
.statement code, .prose code, .rationale code {
  font-size: .88em;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--code-bg);
  border: 1px solid var(--line);
}
.rationale summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; width: fit-content; }
.rationale-body { display: grid; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); max-width: 70ch; }
.rationale-body p, .rationale-body ul { margin: 0; }
.rationale-body ul { padding-left: 20px; }

.claim-copy {
  min-height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid currentColor;
  background: var(--surface);
  color: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.claim-copy:hover { background: var(--surface-2); }
.claim {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  gap: 12px;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}
.claim-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 16px;
  border: 2px solid currentColor;
}
.claim[data-kind="unknown"] { background: var(--surface-2); color: var(--accent); }
.claim[data-kind="unknown"] .claim-text strong { color: var(--accent); }
.guess-result {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.guess-result .glyph { font-weight: 800; font-size: 16px; }
.guess-result[data-match="true"] { background: var(--ok-soft); color: var(--ok); }
.guess-result[data-match="false"] { background: var(--bad-soft); color: var(--bad); }
.guess-result span:last-child { color: var(--ink); }
.card.reveal-in { animation: reveal-in .3s ease-out; }
@keyframes reveal-in {
  from { opacity: .35; transform: scale(.97); }
  to { opacity: 1; transform: none; }
}
.decide-correct { color: var(--claim-good); }
.decide-incorrect { color: var(--claim-bad); }
.decide-correct:hover { background: var(--claim-good-soft); }
.decide-incorrect:hover { background: var(--claim-bad-soft); }
.counts .c-guess b { color: var(--accent); }
.claim[data-kind="correct"] { background: var(--claim-good-soft); color: var(--claim-good); }
.claim[data-kind="incorrect"] { background: var(--claim-bad-soft); color: var(--claim-bad); }
.claim-text { color: var(--ink); font-size: 14px; }
.claim-text strong { font-size: 16px; letter-spacing: .01em; }
.claim[data-kind="correct"] .claim-text strong { color: var(--claim-good); }
.claim[data-kind="incorrect"] .claim-text strong { color: var(--claim-bad); }
.claim-line { font-family: var(--font-code); font-size: 12px; color: var(--muted); white-space: nowrap; }

.parts { padding: 16px 20px 22px; display: grid; gap: 12px; }
.prose { margin: 0; font-size: 14px; color: var(--muted); max-width: 70ch; }
ul.prose { padding-left: 20px; }
.code {
  margin: 0;
  overflow-x: auto;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--code-bg);
  border: 1px solid var(--line);
  font-size: 13px;
  line-height: 1.6;
  tab-size: 2;
  user-select: text;
  -webkit-user-select: text;
}
.code code { font-family: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--hl-key); }
.hljs-string, .hljs-regexp, .hljs-template-variable, .hljs-subst { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-attr { color: var(--hl-num); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_, .hljs-tag, .hljs-name { color: var(--hl-type); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-attribute, .hljs-property { color: var(--hl-type); }

.prev-verdict {
  margin: 0 20px 20px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.prev-verdict[data-verdict="ok"] { border-color: var(--ok); }
.prev-verdict[data-verdict="bad"] { border-color: var(--bad); }
.prev-verdict blockquote { margin: 6px 0 0; white-space: pre-wrap; color: var(--muted); }

.stamp {
  position: absolute;
  top: 18px;
  pointer-events: none;
  font-weight: 800;
  letter-spacing: .06em;
  font-size: 22px;
  padding: 4px 12px;
  border: 3px solid currentColor;
  border-radius: 8px;
  background: var(--surface);
  opacity: 0;
  z-index: 3;
}
.stamp-ok { color: var(--ok); transform: rotate(-10deg); left: 18px; }
.stamp-bad { color: var(--bad); transform: rotate(10deg); right: 18px; }

.ask { text-align: center; font-size: 14px; color: var(--muted); margin: 0; }
.ask strong { color: var(--ink); }
.controls { display: grid; grid-template-columns: 1fr auto auto 1fr; gap: 10px; align-items: center; }
.decide {
  min-height: 52px;
  border-radius: 12px;
  border: 2px solid currentColor;
  background: var(--surface);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 12px;
}
.decide-bad { color: var(--bad); }
.decide-ok { color: var(--ok); }
.decide-bad:hover { background: var(--bad-soft); }
.decide-ok:hover { background: var(--ok-soft); }
.decide .glyph { font-size: 20px; line-height: 1; }
.decide kbd { border-color: currentColor; color: inherit; background: transparent; }

.done {
  height: 100%;
  display: grid;
  place-content: center;
  text-align: center;
  gap: 14px;
  border-radius: 16px;
  border: 1px dashed var(--line);
  background: var(--surface);
  padding: 24px;
}
.done h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; text-wrap: balance; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

dialog.sheet {
  width: min(560px, calc(100vw - 32px));
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 0;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}
dialog.sheet::backdrop { background: rgba(10, 14, 20, .45); }
.sheet form { display: grid; gap: 14px; padding: 20px; }
.sheet h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.sheet .sheet-sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.sheet .sheet-sub code { font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 13px;
  cursor: pointer;
}
.tag[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 500; }
.sheet label { font-size: 13px; font-weight: 500; }
.sheet textarea {
  width: 100%;
  min-height: 110px;
  resize: vertical;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  line-height: 1.5;
}
.sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet-actions .hint { font-size: 12px; color: var(--muted); }
.sheet-actions .row { display: flex; gap: 8px; }

<script type="text/plain" id="sample-md">
# Coding Guidelines — Rule Catalog

## 1. Language baseline

### `lang/strict-equality`

**Severity: `error`**

Compare with `===` and `!==`, the one exception being `== null` as a deliberate
"null or undefined" test outside `dashboard/`.

Incorrect:

```ts
if (step.status == "COMPLETED") {
  return;
}
```

Incorrect:

```ts
if (agent.teamId != teamId) {
  return res.status(401).end();
}
```

A loose comparison on a tenant check, where `undefined != null` is `false`, so a
missing `teamId` passes.

Correct:

```ts
if (current == null) {
  return undefined;
}
```

One test covering both `null` and `undefined`, as `lib/parameterRefs.ts` writes
it.

---

### `lang/nullish-over-logical-or`

**Severity: `warn`**

Use `??` to supply a default for a missing value and keep `||` for genuinely
boolean logic.

Incorrect:

```ts
const score = resultScore || 1;
```

A score of `0` becomes `1`.

Correct:

```ts
const provider = process.env.PLATFORM_LLM || "local";
```

`||` is right where an empty string genuinely means "not configured", as it does
for an environment variable.

<script>
const TAGS = [
  "Label should be flipped",
  "Does not show the rule",
  "Breaks a different rule",
  "Code is wrong or will not compile",
  "Explanation is wrong",
  "Redundant or duplicate",
];

const KIND_LABEL = { correct: "Correct example", incorrect: "Incorrect example" };
const VERDICT_LABEL = { ok: "Label is right", bad: "Flagged" };

const state = {
  view: "home",
  doc: null,
  rules: [],
  examples: [],
  verdicts: new Map(),
  cursor: -1,
  filter: "pending",
  undo: [],
  store: null,
  sheetExample: null,
  sheetTags: new Set(),
  busy: false,
  guessMode: storageRead("rule-swipe:mode", "review") === "guess",
  pendingGuess: null,
};

const app = document.getElementById("app");
const sheet = document.getElementById("sheet");

function storageRead(key, fallback) {
  try {
    const raw = localStorage.getItem(key);

    return raw ? JSON.parse(raw) : fallback;
  } catch (error) {
    return fallback;
  }
}

function storageWrite(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));

    return true;
  } catch (error) {
    return false;
  }
}

function localStore() {
  const sourcesKey = "ornek-swipe:sources";
  const reviewsKey = (docKey) => `ornek-swipe:reviews:${docKey}`;

  return {
    kind: "local",
    async listSources() {
      return Object.values(storageRead(sourcesKey, {})).map((source) => ({ ...source, origin: "upload" }));
    },
    async saveSource(source) {
      const all = storageRead(sourcesKey, {});

      all[source.key] = source;

      if (!storageWrite(sourcesKey, all)) {
        throw new Error("LOCAL_STORAGE_FULL");
      }
    },
    async loadVerdicts(docKey) {
      return storageRead(reviewsKey(docKey), {});
    },
    async saveVerdict(record) {
      const all = storageRead(reviewsKey(record.doc), {});

      all[record.id] = record;
      storageWrite(reviewsKey(record.doc), all);
    },
    async deleteVerdict(docKey, id) {
      const all = storageRead(reviewsKey(docKey), {});

      delete all[id];
      storageWrite(reviewsKey(docKey), all);
    },
  };
}

function memoryStore() {
  return {
    kind: "sample",
    async listSources() {
      return [];
    },
    async saveSource() {},
    async loadVerdicts() {
      return {};
    },
    async saveVerdict() {},
    async deleteVerdict() {},
  };
}

async function request(method, url, body) {
  const response = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });

  if (!response.ok) {
    throw new Error(`REQUEST_FAILED_${response.status}`);
  }

  return response.status === 204 ? null : response.json();
}

function apiStore() {
  const chains = new Map();

  function serial(id, task) {
    const next = (chains.get(id) ?? Promise.resolve()).catch(() => {}).then(task);

    chains.set(id, next);

    return next;
  }

  return {
    kind: "api",
    listSources() {
      return request("GET", "/api/sources");
    },
    saveSource(source) {
      return serial(`source:${source.key}`, () =>
        request("PUT", `/api/sources/${encodeURIComponent(source.key)}`, source)
      );
    },
    loadVerdicts(docKey) {
      return request("GET", `/api/reviews?doc=${encodeURIComponent(docKey)}`);
    },
    saveVerdict(record) {
      return serial(record.id, () =>
        request("PUT", `/api/reviews/${encodeURIComponent(record.id)}`, record)
      );
    },
    deleteVerdict(docKey, id) {
      return serial(id, () => request("DELETE", `/api/reviews/${encodeURIComponent(id)}`));
    },
  };
}

const storeReady = fetch("/api/health")
  .then((response) => (response.ok ? apiStore() : localStore()))
  .catch(() => localStore());

storeReady.then((store) => {
  if (state.view === "home") {
    setPersist(store.kind);
    renderSavedList();
  }
});

function setPersist(kind) {
  const el = document.getElementById("persist");
  const text = {
    api: "Saved to scripts/rule-swipe/reviews.json",
    local: "Saved in this browser only",
    sample: "Sample mode, not saved",
    pending: "Connecting to storage",
  }[kind];

  el.dataset.kind = kind;
  el.innerHTML = `<span>${text}</span>`;
  el.title = text;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function inline(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
}

function renderParagraph(text, className) {
  const lines = text.split("\n");

  if (/^\s*[-*]\s/.test(lines[0])) {
    const items = [];

    lines.forEach((line) => {
      if (/^\s*[-*]\s/.test(line)) {
        items.push(line.replace(/^\s*[-*]\s/, ""));
      } else if (items.length) {
        items[items.length - 1] += ` ${line.trim()}`;
      }
    });

    return `<ul class="${className}">${items.map((item) => `<li>${inline(item)}</li>`).join("")}</ul>`;
  }

  return `<p class="${className}">${inline(lines.join(" "))}</p>`;
}

function highlight(code, lang) {
  const language = { tsx: "typescript", ts: "typescript", js: "javascript", jsx: "javascript", yml: "yaml" }[lang] ?? lang;

  if (window.hljs && language && window.hljs.getLanguage(language)) {
    try {
      return window.hljs.highlight(code, { language, ignoreIllegals: true }).value;
    } catch (error) {
      return escapeHtml(code);
    }
  }

  return escapeHtml(code);
}

function hashText(text) {
  let hash = 5381;

  for (let i = 0; i < text.length; i++) {
    hash = ((hash << 5) + hash + text.charCodeAt(i)) | 0;
  }

  return (hash >>> 0).toString(36);
}

function segment(value) {
  return value.replace(/\//g, ":").replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 120);
}

function docKeyFor(name) {
  const base = name.replace(/\.(md|markdown|txt)$/i, "").toLowerCase();
  const key = segment(base).replace(/^[.]+/, "");

  return key || `doc-${hashText(name)}`;
}

function parseCatalog(text) {
  const lines = text.split(/\r?\n/);
  const rules = [];
  const examples = [];
  let section = "";
  let rule = null;
  let example = null;
  let paragraph = null;
  let fence = null;

  const target = () => (example ? example.parts : rule ? rule.desc : null);

  const flush = () => {
    if (!paragraph) return;

    const parts = target();

    if (parts) parts.push({ type: "p", text: paragraph.join("\n") });

    paragraph = null;
  };

  lines.forEach((line, index) => {
    if (fence) {
      if (/^\s*```\s*$/.test(line)) {
        const parts = target();

        if (parts) parts.push({ type: "code", lang: fence.lang, code: fence.lines.join("\n") });

        fence = null;
      } else {
        fence.lines.push(line);
      }

      return;
    }

    const open = line.match(/^\s*```\s*([\w+-]*)\s*$/);

    if (open) {
      flush();
      fence = { lang: open[1].toLowerCase(), lines: [] };
      return;
    }

    let match = line.match(/^##\s+(.+?)\s*$/);

    if (match) {
      flush();
      section = match[1];
      rule = null;
      example = null;
      return;
    }

    match = line.match(/^###\s+`([^`]+)`/);

    if (match) {
      flush();
      rule = { id: match[1], section, severity: "", desc: [], examples: [], line: index + 1 };
      rules.push(rule);
      example = null;
      return;
    }

    if (/^#{1,6}\s/.test(line) || /^-{3,}\s*$/.test(line)) {
      flush();
      rule = null;
      example = null;
      return;
    }

    if (!rule) return;

    match = line.match(/^\*\*Severity:\s*`?([\w-]+)`?\s*\*\*/i);

    if (match) {
      flush();
      rule.severity = match[1].toLowerCase();
      return;
    }

    match = line.match(/^(Correct|Incorrect):\s*$/);

    if (match) {
      flush();
      example = { rule, kind: match[1].toLowerCase(), parts: [], line: index + 1 };
      rule.examples.push(example);
      examples.push(example);
      return;
    }

    if (!line.trim()) {
      flush();
      return;
    }

    (paragraph ??= []).push(line);
  });

  flush();

  rules.forEach((item) => {
    const paragraphs = item.desc.filter((part) => part.type === "p");

    item.statement = paragraphs[0]?.text ?? "";
    item.rationale = item.desc.filter((part) => part !== paragraphs[0]);

    ["correct", "incorrect"].forEach((kind) => {
      const ofKind = item.examples.filter((ex) => ex.kind === kind);

      ofKind.forEach((ex, i) => {
        ex.ordinal = i + 1;
        ex.kindTotal = ofKind.length;
      });
    });
  });

  return { rules: rules.filter((item) => item.examples.length), examples };
}

function exampleCode(example) {
  return example.parts
    .filter((part) => part.type === "code")
    .map((part) => part.code)
    .join("\n\n");
}

function assignIds(examples, docKey) {
  examples.forEach((example) => {
    const fingerprint = hashText(
      example.kind + example.parts.map((part) => part.code ?? part.text).join("\n")
    );

    example.id = [
      segment(docKey),
      segment(example.rule.id),
      `${example.kind === "correct" ? "c" : "i"}${example.ordinal}`,
      fingerprint,
    ].join("~");
  });
}

function counts() {
  let ok = 0;
  let bad = 0;

  state.examples.forEach((example) => {
    const verdict = state.verdicts.get(example.id)?.verdict;

    if (verdict === "ok") ok++;
    if (verdict === "bad") bad++;
  });

  return { ok, bad, pending: state.examples.length - ok - bad, total: state.examples.length };
}

function matches(example) {
  const verdict = state.verdicts.get(example.id)?.verdict;

  if (state.filter === "pending") return !verdict;
  if (state.filter === "bad") return verdict === "bad";

  return true;
}

function findMatching(from, { wrap }) {
  const total = state.examples.length;

  for (let i = from + 1; i < total; i++) {
    if (matches(state.examples[i])) return i;
  }

  if (!wrap) return -1;

  for (let i = 0; i <= Math.min(from, total - 1); i++) {
    if (matches(state.examples[i])) return i;
  }

  return -1;
}

function nextAfter(index) {
  const wrap = state.filter === "pending";
  const found = findMatching(index, { wrap });

  return found === index ? -1 : found;
}

function toast(message) {
  const el = document.getElementById("toast");

  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    el.hidden = true;
  }, 3200);
}

function renderTopbarDoc() {
  const el = document.getElementById("topbar-doc");

  if (!state.doc) {
    el.innerHTML = "";
    return;
  }

  el.innerHTML = `<span class="doc-label">Reviewing:</span><span class="doc-name">${escapeHtml(state.doc.name)}</span>`;
}

function render() {
  renderTopbarDoc();

  if (state.view === "home") renderHome();
  if (state.view === "review") renderReview();
  if (state.view === "summary") renderSummary();
}

function guessResultHtml(example, reveal) {
  if (reveal.guess === example.kind) {
    return `<div class="guess-result" data-match="true"><span class="glyph">✓</span><span>Match. You said <strong>${KIND_LABEL[reveal.guess]}</strong> and the catalog agrees.</span></div>`;
  }

  return `<div class="guess-result" data-match="false"><span class="glyph">✗</span><span>Mismatch. You said <strong>${KIND_LABEL[reveal.guess]}</strong>, but the catalog labels it <strong>${KIND_LABEL[example.kind]}</strong>.</span></div>`;
}

function cardHtml(example, { preview = false } = {}) {
  const { rule } = example;
  const reveal = !preview && state.pendingGuess?.id === example.id ? state.pendingGuess : null;
  const guessing = !preview && state.guessMode && !reveal;
  const record = preview || guessing ? null : state.verdicts.get(example.id);
  const rationale = rule.rationale.length
    ? `<details class="rationale"><summary>Rule rationale and notes</summary><div class="rationale-body">${rule.rationale
        .map((part) =>
          part.type === "code"
            ? `<pre class="code"><code>${highlight(part.code, part.lang)}</code></pre>`
            : renderParagraph(part.text, "")
        )
        .join("")}</div></details>`
    : "";
  const parts = example.parts
    .filter((part) => !guessing || part.type === "code")
    .map((part) =>
      part.type === "code"
        ? `<pre class="code"><code>${highlight(part.code, part.lang)}</code></pre>`
        : renderParagraph(part.text, "prose")
    )
    .join("");
  const previous = record
    ? `<div class="prev-verdict" data-verdict="${record.verdict}"><strong>Previous verdict:</strong> ${VERDICT_LABEL[record.verdict]}${
        record.tags?.length ? ` · ${escapeHtml(record.tags.join(", "))}` : ""
      }${record.comment ? `<blockquote>${escapeHtml(record.comment)}</blockquote>` : ""}</div>`
    : "";
  const severityClass = rule.severity === "error" ? "sev-error" : rule.severity === "warn" ? "sev-warn" : "";
  const claim = guessing
    ? `<div class="claim" data-kind="unknown">
        <span class="claim-mark" aria-hidden="true">?</span>
        <div class="claim-text"><strong>Correct or incorrect?</strong> The label stays hidden until you decide.</div>
        <span class="claim-line">line ${example.line}</span>
      </div>`
    : `<div class="claim" data-kind="${example.kind}">
        <span class="claim-mark" aria-hidden="true">${example.kind === "correct" ? "✓" : "✗"}</span>
        <div class="claim-text">Labelled <strong>${KIND_LABEL[example.kind]}</strong> · ${example.ordinal} / ${example.kindTotal}</div>
        <span class="claim-line">line ${example.line}</span>
        ${preview ? "" : '<button class="claim-copy" type="button" id="copy-example" title="Copy the rule, label and code as Markdown">Copy</button>'}
      </div>`;

  return `
    <article class="card" id="${preview ? "preview-card" : "card"}" tabindex="-1" aria-label="${escapeHtml(rule.id)} ${guessing ? "" : KIND_LABEL[example.kind]} ${guessing ? "" : example.ordinal}">
      <div class="stamp stamp-ok" aria-hidden="true">${guessing ? "CORRECT" : "RIGHT"}</div>
      <div class="stamp stamp-bad" aria-hidden="true">${guessing ? "INCORRECT" : "FLAGGED"}</div>
      <header class="card-head">
        <div class="crumb">${escapeHtml(rule.section)}</div>
        <div class="rule-line">
          <code class="rule-id">${escapeHtml(rule.id)}</code>
          ${rule.severity ? `<span class="sev ${severityClass}">${escapeHtml(rule.severity)}</span>` : ""}
        </div>
        ${rule.statement ? `<p class="statement">${inline(rule.statement.replace(/\n/g, " "))}</p>` : ""}
        ${rationale}
      </header>
      ${claim}
      ${reveal ? guessResultHtml(example, reveal) : ""}
      <div class="parts">${parts || '<p class="prose">This example has no code.</p>'}</div>
      ${previous}
    </article>`;
}

async function renderSavedList() {
  const list = document.getElementById("saved-list");

  if (!list) return;

  const store = await storeReady;
  let sources = [];

  try {
    sources = await store.listSources();
  } catch (error) {
    list.innerHTML = '<p class="empty-note">Could not load catalogs. You can still upload a file.</p>';
    return;
  }

  if (!document.body.contains(list)) return;

  if (!sources.length) {
    list.innerHTML = '<p class="empty-note">No rule catalogs found in this repo. Uploaded <code>.md</code> files show up here with their progress.</p>';
    return;
  }

  const withProgress = await Promise.all(
    sources.map(async (source) => {
      const parsed = parseCatalog(source.text ?? "");

      assignIds(parsed.examples, source.key);

      const ids = new Set(parsed.examples.map((example) => example.id));

      try {
        const verdicts = Object.values(await store.loadVerdicts(source.key)).filter((record) => ids.has(record.id));

        return {
          source,
          ruleCount: parsed.rules.length,
          exampleCount: parsed.examples.length,
          ok: verdicts.filter((record) => record.verdict === "ok").length,
          bad: verdicts.filter((record) => record.verdict === "bad").length,
        };
      } catch (error) {
        return { source, ruleCount: parsed.rules.length, exampleCount: parsed.examples.length, ok: 0, bad: 0 };
      }
    })
  );

  if (!document.body.contains(list)) return;

  const item = ({ source, ruleCount, exampleCount, ok, bad }) => {
    const total = exampleCount || 1;
    const started = ok + bad > 0;

    return `
      <button class="saved-item" type="button" data-key="${escapeHtml(source.key)}">
        <span class="name">${escapeHtml(source.name)}</span>
        <span class="go">${started ? "Resume →" : "Start →"}</span>
        <span class="meta">${ruleCount} rules · ${exampleCount} examples · ${ok} right · ${bad} flagged · ${Math.max(0, exampleCount - ok - bad)} left</span>
        <span class="mini-progress"><i style="width:${(ok / total) * 100}%;background:var(--ok)"></i><i style="width:${(bad / total) * 100}%;background:var(--bad)"></i></span>
      </button>`;
  };

  const groups = [
    { title: "Catalogs in this repo", rows: withProgress.filter((row) => row.source.origin === "repo") },
    { title: "Your uploads", rows: withProgress.filter((row) => row.source.origin !== "repo") },
  ].filter((group) => group.rows.length);

  list.innerHTML = groups
    .map(
      (group) => `
        <div class="saved-group">
          <p class="eyebrow">${group.title}</p>
          ${group.rows.map(item).join("")}
        </div>`
    )
    .join("");

  list.querySelectorAll(".saved-item").forEach((button) => {
    button.addEventListener("click", () => {
      const source = sources.find((entry) => entry.key === button.dataset.key);

      if (source?.text) {
        openDocument({ name: source.name, text: source.text, key: source.key, origin: source.origin });
      }
    });
  });
}

function readFile(file) {
  const reader = new FileReader();

  reader.onload = () => openDocument({ name: file.name, text: String(reader.result), origin: "upload" });
  reader.onerror = () => toast("Could not read the file. Try another one.");
  reader.readAsText(file);
}

async function openDocument({ name, text, key: givenKey, origin = "upload", isSample = false }) {
  const parsed = parseCatalog(text);

  if (!parsed.examples.length) {
    toast("No Correct: / Incorrect: examples found under ### `rule-id` headings in this file.");
    return;
  }

  const key = isSample ? "ornek" : givenKey ?? docKeyFor(name);

  assignIds(parsed.examples, key);

  state.store = isSample ? memoryStore() : await storeReady;
  state.doc = { key, name, isSample };
  state.rules = parsed.rules;
  state.examples = parsed.examples;
  state.undo = [];
  state.filter = "pending";

  let stored = {};

  try {
    stored = await state.store.loadVerdicts(key);
  } catch (error) {
    toast("Could not load earlier verdicts. New verdicts will still be saved.");
  }

  state.verdicts = new Map(
    Object.entries(stored).filter(([id]) => parsed.examples.some((example) => example.id === id))
  );

  if (!isSample && origin === "upload") {
    state.store
      .saveSource({ key, name, text, uploadedAt: new Date().toISOString() })
      .catch(() => toast("Could not store the file itself. Verdicts are still being saved."));
  }

  setPersist(state.store.kind);
  state.cursor = findMatching(-1, { wrap: false });

  if (state.cursor === -1) {
    state.filter = "all";
    state.cursor = state.examples.length;
  }

  state.view = "review";
  render();
}

function guessStats() {
  let made = 0;
  let matched = 0;

  state.examples.forEach((example) => {
    const record = state.verdicts.get(example.id);

    if (!record?.guess) return;

    made++;

    if (record.guess === example.kind) matched++;
  });

  return { made, matched };
}

function guessDisagreements() {
  return state.examples.filter((example) => {
    const record = state.verdicts.get(example.id);

    return record?.guess && record.guess !== example.kind;
  });
}

function askAndControls(current) {
  const reveal = state.pendingGuess?.id === current.id ? state.pendingGuess : null;
  const undoDisabled = state.undo.length || reveal ? "" : "disabled";
  const undoTitle = reveal ? "Hide the answer and guess again (Z)" : "Undo the last verdict (Z)";
  let ask = `Under this rule, is this really ${current.kind === "correct" ? "a" : "an"} <strong>${KIND_LABEL[current.kind].toLowerCase()}</strong>?`;
  let hint = ["← swipe to flag", "label is right, swipe →"];
  let left = '<button class="decide decide-bad" type="button" id="btn-bad"><span class="glyph">✗</span> Flag <kbd>←</kbd></button>';
  let right = '<button class="decide decide-ok" type="button" id="btn-ok"><kbd>→</kbd> Label is right <span class="glyph">✓</span></button>';

  if (state.guessMode && !reveal) {
    ask = "Under this rule, is this code <strong>correct</strong> or <strong>incorrect</strong>?";
    hint = ["← incorrect", "correct →"];
    left = '<button class="decide decide-incorrect" type="button" id="btn-bad"><span class="glyph">✗</span> Incorrect <kbd>←</kbd></button>';
    right = '<button class="decide decide-correct" type="button" id="btn-ok"><kbd>→</kbd> Correct <span class="glyph">✓</span></button>';
  } else if (reveal && reveal.guess === current.kind) {
    ask = "You matched the catalog.";
    hint = ["← flag anyway", "next →"];
    left = '<button class="decide decide-bad" type="button" id="btn-bad"><span class="glyph">✗</span> Flag anyway <kbd>←</kbd></button>';
    right = '<button class="decide decide-ok" type="button" id="btn-ok"><kbd>→</kbd> Next <span class="glyph">✓</span></button>';
  } else if (reveal) {
    ask = "Your guess and the catalog disagree. Which one is wrong?";
    hint = ["← flag the label", "I was wrong →"];
    left = '<button class="decide decide-bad" type="button" id="btn-bad"><span class="glyph">✗</span> Flag the label <kbd>←</kbd></button>';
    right = '<button class="decide decide-ok" type="button" id="btn-ok"><kbd>→</kbd> I was wrong <span class="glyph">✓</span></button>';
  }

  return `<p class="ask">${ask}<span class="swipe-hint"><span class="bad">${hint[0]}</span> · <span class="ok">${hint[1]}</span></span></p>
      <div class="controls">
        ${left}
        <button class="btn btn-quiet" type="button" id="btn-undo" ${undoDisabled} title="${undoTitle}">↶ Undo</button>
        <button class="btn btn-quiet" type="button" id="btn-skip" title="Skip (↑)">Skip ↑</button>
        ${right}
      </div>`;
}

function setMode(mode) {
  state.guessMode = mode === "guess";
  state.pendingGuess = null;
  storageWrite("rule-swipe:mode", mode);
  render();
}

function renderReview() {
  const c = counts();
  const current = state.examples[state.cursor];
  const nextIndex = current ? nextAfter(state.cursor) : -1;

  if (state.pendingGuess && state.pendingGuess.id !== current?.id) {
    state.pendingGuess = null;
  }

  const guesses = guessStats();
  const canUndo = state.undo.length || state.pendingGuess;

  app.innerHTML = `
    <div class="review">
      <div class="review-bar">
        <div class="review-bar-row">
          <div class="counts">
            <span class="c-ok"><b>${c.ok}</b> right</span>
            <span class="c-bad"><b>${c.bad}</b> flagged</span>
            <span><b>${c.pending}</b> left</span>
            <span>/ ${c.total}</span>
            ${state.guessMode ? `<span class="c-guess"><b>${guesses.matched}/${guesses.made}</b> guesses matched</span>` : ""}
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div class="seg" role="group" aria-label="Mode">
              <button type="button" data-mode="review" aria-pressed="${!state.guessMode}">Review</button>
              <button type="button" data-mode="guess" aria-pressed="${state.guessMode}">Guess</button>
            </div>
            <div class="seg" role="group" aria-label="Which cards to show">
              <button type="button" data-filter="pending" aria-pressed="${state.filter === "pending"}">Left</button>
              <button type="button" data-filter="all" aria-pressed="${state.filter === "all"}">All</button>
              <button type="button" data-filter="bad" aria-pressed="${state.filter === "bad"}">Flagged</button>
            </div>
            <button class="btn top-undo" type="button" id="btn-undo-top" ${canUndo ? "" : "disabled"} title="Undo the last verdict">↶ Undo</button>
            <button class="btn" type="button" id="to-summary">Summary and report</button>
          </div>
        </div>
        <div class="progress" aria-hidden="true">
          <i style="width:${(c.ok / c.total) * 100}%;background:var(--ok)"></i>
          <i style="width:${(c.bad / c.total) * 100}%;background:var(--bad)"></i>
        </div>
      </div>
      <div class="stack">
        ${current && nextIndex !== -1 ? '<div class="ghost" aria-hidden="true"></div>' : ""}
        ${current ? cardHtml(current) : doneHtml(c)}
      </div>
      ${current ? askAndControls(current) : ""}
    </div>`;

  app.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => setFilter(button.dataset.filter));
  });
  app.querySelectorAll("[data-mode]").forEach((button) => {
    button.addEventListener("click", () => setMode(button.dataset.mode));
  });
  document.getElementById("btn-undo-top").addEventListener("click", () => undo());
  document.getElementById("to-summary").addEventListener("click", () => {
    state.view = "summary";
    render();
  });

  const card = document.getElementById("card");

  if (card) {
    bindSwipe(card);
    document.getElementById("copy-example")?.addEventListener("click", () => {
      copyText(exampleMarkdown(current), "Example");
    });
    document.getElementById("btn-ok").addEventListener("click", () => approve());
    document.getElementById("btn-bad").addEventListener("click", () => reject());
    document.getElementById("btn-skip").addEventListener("click", () => skip());
    document.getElementById("btn-undo").addEventListener("click", () => undo());
  }

  app.querySelectorAll("[data-action]").forEach((button) => {
    button.addEventListener("click", () => {
      const action = button.dataset.action;

      if (action === "summary") {
        state.view = "summary";
        render();
      }

      if (action === "undo") undo();
      if (action === "all") setFilter("all");
      if (action === "pending") setFilter("pending");
    });
  });
}

function doneHtml(c) {
  const title = {
    pending: c.pending ? "No cards left in this filter" : "Every example is reviewed",
    all: "You reached the end of the catalog",
    bad: c.bad ? "You reached the last flagged card" : "No examples are flagged",
  }[state.filter];

  return `
    <div class="done">
      <h2>${title}</h2>
      <p>${c.ok} right · ${c.bad} flagged · ${c.pending} left</p>
      <div class="row">
        <button class="btn btn-primary" type="button" data-action="summary">Open summary and report</button>
        ${state.undo.length ? '<button class="btn" type="button" data-action="undo">Undo the last verdict</button>' : ""}
        ${state.filter !== "all" ? '<button class="btn" type="button" data-action="all">Go through all from the start</button>' : ""}
        ${state.filter !== "pending" && c.pending ? '<button class="btn" type="button" data-action="pending">Back to the cards left</button>' : ""}
      </div>
    </div>`;
}

function setFilter(filter) {
  state.filter = filter;

  const current = state.examples[state.cursor];

  if (!current || !matches(current)) {
    state.cursor = findMatching(-1, { wrap: false });

    if (state.cursor === -1) state.cursor = state.examples.length;
  }

  render();
}

function recordFor(example, verdict, extra) {
  return {
    id: example.id,
    doc: state.doc.key,
    docName: state.doc.name,
    ruleId: example.rule.id,
    section: example.rule.section,
    severity: example.rule.severity,
    kind: example.kind,
    ordinal: example.ordinal,
    kindTotal: example.kindTotal,
    line: example.line,
    verdict,
    comment: extra.comment ?? "",
    tags: extra.tags ?? [],
    guess: extra.guess ?? null,
    guessMatched: extra.guess ? extra.guess === example.kind : null,
    code: exampleCode(example).slice(0, 4000),
    updatedAt: new Date().toISOString(),
  };
}

async function decide(example, verdict, extra = {}) {
  const index = state.examples.indexOf(example);
  const previous = state.verdicts.get(example.id) ?? null;
  const guess = state.pendingGuess?.id === example.id ? state.pendingGuess.guess : previous?.guess ?? null;
  const record = recordFor(example, verdict, { ...extra, guess });

  state.pendingGuess = null;
  state.verdicts.set(example.id, record);
  state.undo.push({ id: example.id, previous, index });

  const next = nextAfter(index);

  state.cursor = next === -1 ? state.examples.length : next;
  render();

  try {
    await state.store.saveVerdict(record);
  } catch (error) {
    toast("Could not save the verdict. Check that the server is running and mark the card again.");
  }
}

function fly(direction, done) {
  const card = document.getElementById("card");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!card || reduced) {
    done();
    return;
  }

  state.busy = true;
  card.classList.remove("snap");
  card.style.transition = "transform .26s ease-in, opacity .26s ease-in";
  card.style.transform = `translateX(${direction * window.innerWidth * 1.05}px) rotate(${direction * 16}deg)`;
  card.style.opacity = "0";
  card.querySelector(direction > 0 ? ".stamp-ok" : ".stamp-bad").style.opacity = "1";

  setTimeout(() => {
    state.busy = false;
    done();
  }, 240);
}

function isGuessing(example) {
  return state.guessMode && state.pendingGuess?.id !== example.id;
}

function makeGuess(example, guess) {
  state.pendingGuess = { id: example.id, guess };
  render();

  const card = document.getElementById("card");

  if (card && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    card.classList.add("reveal-in");
  }
}

function approve() {
  const example = state.examples[state.cursor];

  if (!example || state.busy) return;

  if (isGuessing(example)) {
    makeGuess(example, "correct");
    return;
  }

  fly(1, () => decide(example, "ok"));
}

function reject() {
  const example = state.examples[state.cursor];

  if (!example || state.busy) return;

  if (isGuessing(example)) {
    makeGuess(example, "incorrect");
    return;
  }

  fly(-1, () => openSheet(example));
}

function skip() {
  const example = state.examples[state.cursor];

  if (!example || state.busy) return;

  const wrap = state.filter === "pending";
  const next = findMatching(state.cursor, { wrap });

  if (next === -1 || next === state.cursor) {
    toast(wrap ? "No other cards to skip to." : "This is the last card.");
    return;
  }

  state.cursor = next;
  render();
}

async function undo() {
  if (state.pendingGuess) {
    state.pendingGuess = null;
    render();
    return;
  }

  const last = state.undo.pop();

  if (!last) return;

  const example = state.examples[last.index];

  if (last.previous) {
    state.verdicts.set(last.id, last.previous);
  } else {
    state.verdicts.delete(last.id);
  }

  state.cursor = last.index;
  render();

  try {
    if (last.previous) {
      await state.store.saveVerdict(last.previous);
    } else {
      await state.store.deleteVerdict(state.doc.key, example.id);
    }
  } catch (error) {
    toast("Could not save the undo. Mark the card again.");
  }
}

function bindSwipe(card) {
  let start = null;
  let dragging = false;
  let dx = 0;
  const stampOk = card.querySelector(".stamp-ok");
  const stampBad = card.querySelector(".stamp-bad");

  const threshold = () => Math.min(140, card.offsetWidth * 0.26);

  const reset = () => {
    card.classList.add("snap");
    card.style.transform = "";
    stampOk.style.opacity = "0";
    stampBad.style.opacity = "0";
    card.classList.remove("dragging");
  };

  card.addEventListener("pointerdown", (event) => {
    if (state.busy || event.button !== 0) return;
    if (event.target.closest("summary, a, button, pre.code")) return;

    start = { x: event.clientX, y: event.clientY, id: event.pointerId };
    dragging = false;
    dx = 0;
  });

  card.addEventListener("pointermove", (event) => {
    if (!start || event.pointerId !== start.id) return;

    const moveX = event.clientX - start.x;
    const moveY = event.clientY - start.y;

    if (!dragging) {
      if (Math.abs(moveX) > 10 && Math.abs(moveX) > Math.abs(moveY) * 1.3) {
        dragging = true;
        card.classList.remove("snap");
        card.classList.add("dragging");
        card.setPointerCapture(event.pointerId);
      } else if (Math.abs(moveY) > 12) {
        start = null;
      }

      return;
    }

    dx = moveX;

    const progress = Math.min(1, Math.abs(dx) / threshold());

    card.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    stampOk.style.opacity = dx > 0 ? String(progress) : "0";
    stampBad.style.opacity = dx < 0 ? String(progress) : "0";
  });

  const finish = (event) => {
    if (!start || event.pointerId !== start.id) return;

    const wasDragging = dragging;

    start = null;
    dragging = false;

    if (!wasDragging) return;

    if (dx > threshold()) {
      approve();
    } else if (dx < -threshold()) {
      reject();
    } else {
      reset();
    }
  };

  card.addEventListener("pointerup", finish);
  card.addEventListener("pointercancel", (event) => {
    if (start && event.pointerId === start.id) {
      start = null;
      dragging = false;
      reset();
    }
  });
}

function openSheet(example) {
  const existing = state.verdicts.get(example.id);
  const prefill = existing?.verdict === "bad" ? existing : null;

  const guessedOtherwise =
    state.pendingGuess?.id === example.id && state.pendingGuess.guess !== example.kind;

  state.sheetExample = example;
  state.sheetTags = new Set(prefill?.tags ?? (guessedOtherwise ? [TAGS[0]] : []));

  document.getElementById("sheet-sub").innerHTML = `<code>${escapeHtml(example.rule.id)}</code> · ${KIND_LABEL[example.kind]} ${example.ordinal} / ${example.kindTotal} · line ${example.line}`;
  document.getElementById("sheet-comment").value = prefill?.comment ?? "";
  renderSheetTags();

  if (!sheet.open) sheet.showModal();

  document.getElementById("sheet-comment").focus();
}

function renderSheetTags() {
  const wrap = document.getElementById("sheet-tags");

  wrap.innerHTML = TAGS.map(
    (tag) => `<button class="tag" type="button" aria-pressed="${state.sheetTags.has(tag)}">${escapeHtml(tag)}</button>`
  ).join("");

  wrap.querySelectorAll(".tag").forEach((button, i) => {
    button.addEventListener("click", () => {
      const tag = TAGS[i];

      if (state.sheetTags.has(tag)) {
        state.sheetTags.delete(tag);
      } else {
        state.sheetTags.add(tag);
      }

      button.setAttribute("aria-pressed", String(state.sheetTags.has(tag)));
    });
  });
}

function closeSheet({ save }) {
  const example = state.sheetExample;

  state.sheetExample = null;

  if (sheet.open) sheet.close();

  if (!example) return;

  if (save) {
    decide(example, "bad", {
      comment: document.getElementById("sheet-comment").value.trim(),
      tags: [...state.sheetTags],
    });
    return;
  }

  state.cursor = state.examples.indexOf(example);

  if (state.view === "review") render();
}

document.getElementById("sheet-form").addEventListener("submit", (event) => {
  event.preventDefault();
  closeSheet({ save: true });
});
document.getElementById("sheet-cancel").addEventListener("click", () => closeSheet({ save: false }));
sheet.addEventListener("cancel", (event) => {
  event.preventDefault();
  closeSheet({ save: false });
});
document.getElementById("sheet-comment").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    closeSheet({ save: true });
  }
});

document.addEventListener("keydown", (event) => {
  if (state.view !== "review" || sheet.open) return;
  if (event.target.closest("input, textarea, select")) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const key = event.key;

  if (key === "ArrowRight" || key === "l") {
    event.preventDefault();
    approve();
  } else if (key === "ArrowLeft" || key === "h") {
    event.preventDefault();
    reject();
  } else if (key === "ArrowUp" || key === "s") {
    event.preventDefault();
    skip();
  } else if (key === "z" || key === "Backspace") {
    event.preventDefault();
    undo();
  }
});

const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
const themeToggle = document.getElementById("theme-toggle");

function currentTheme() {
  const chosen = document.documentElement.dataset.theme;

  if (chosen === "light" || chosen === "dark") return chosen;

  return systemDark.matches ? "dark" : "light";
}

function labelThemeToggle() {
  const label = currentTheme() === "dark" ? "Switch to light mode" : "Switch to dark mode";

  themeToggle.setAttribute("aria-label", label);
  themeToggle.title = label;
}

themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";

  document.documentElement.dataset.theme = next;
  try {
    localStorage.setItem("rule-swipe:theme", next);
  } catch (error) {
    toast("Theme changed, but this browser could not remember it.");
  }

  labelThemeToggle();
});
systemDark.addEventListener("change", labelThemeToggle);
labelThemeToggle();

document.getElementById("brand").addEventListener("click", () => {
  state.view = "home";
  state.doc = null;
  render();
});

function bucketedRules() {
  const sections = [];

  state.rules.forEach((rule) => {
    let bucket = sections[sections.length - 1];

    if (!bucket || bucket.name !== rule.section) {
      bucket = { name: rule.section, rules: [] };
      sections.push(bucket);
    }

    bucket.rules.push(rule);
  });

  return sections;
}

function reportMarkdown() {
  const c = counts();
  const lines = [
    `# Example review report: ${state.doc.name}`,
    "",
    `Right: ${c.ok} · Flagged: ${c.bad} · Not reviewed: ${c.pending} · Total: ${c.total}`,
    "",
  ];
  const guesses = guessStats();

  if (guesses.made) {
    lines.splice(3, 0, "", `Guesses matched: ${guesses.matched}/${guesses.made}`);
  }

  state.rules.forEach((rule) => {
    const flagged = rule.examples.filter((example) => state.verdicts.get(example.id)?.verdict === "bad");

    if (!flagged.length) return;

    lines.push(`## \`${rule.id}\``, "");

    flagged.forEach((example) => {
      const record = state.verdicts.get(example.id);
      const tags = record.tags?.length ? ` — ${record.tags.join(", ")}` : "";
      const guess = record.guess ? ` · my guess: ${KIND_LABEL[record.guess]}` : "";

      lines.push(`- **${KIND_LABEL[example.kind]} ${example.ordinal}/${example.kindTotal}** (line ${example.line})${guess}${tags}`);

      if (record.comment) {
        record.comment.split("\n").forEach((line) => lines.push(`  > ${line}`));
      }
    });

    lines.push("");
  });

  if (!c.bad) lines.push("No examples are flagged.", "");

  const disagreements = guessDisagreements();

  if (disagreements.length) {
    lines.push("## Guesses that differed from the .md", "");

    disagreements.forEach((example) => {
      const record = state.verdicts.get(example.id);
      const outcome = record.verdict === "bad" ? "flagged the label" : "kept the label";

      lines.push(`- \`${example.rule.id}\` (line ${example.line}): guessed ${KIND_LABEL[record.guess]}, .md says ${KIND_LABEL[example.kind]} — ${outcome}`);
    });

    lines.push("");
  }

  return lines.join("\n");
}

function reportJson() {
  const flagged = state.examples
    .map((example) => state.verdicts.get(example.id))
    .filter((record) => record?.verdict === "bad");

  return JSON.stringify({ doc: state.doc.name, generatedAt: new Date().toISOString(), counts: counts(), flagged }, null, 2);
}

function showFallback(text) {
  const holder = document.getElementById("fallback");

  if (!holder) return;

  holder.innerHTML = `<div class="fallback-copy"><p class="empty-note">Clipboard access was refused. The text is selected; press <kbd>⌘</kbd> <kbd>C</kbd> to copy it.</p><textarea id="fallback-text" readonly></textarea></div>`;

  const area = document.getElementById("fallback-text");

  area.value = text;
  area.focus();
  area.select();
}

function legacyCopy(text) {
  const area = document.createElement("textarea");

  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);

  let copied = false;

  try {
    copied = document.execCommand("copy");
  } catch (error) {
    copied = false;
  }

  area.remove();

  return copied;
}

function copyText(text, label) {
  const copied = () => toast(`${label} copied to the clipboard.`);

  const fallback = () => {
    if (legacyCopy(text)) {
      copied();
    } else if (document.getElementById("fallback")) {
      showFallback(text);
    } else {
      toast("This browser refused clipboard access. Select the text and copy it by hand.");
    }
  };

  if (!window.isSecureContext || !navigator.clipboard?.writeText) {
    fallback();
    return;
  }

  navigator.clipboard.writeText(text).then(copied, fallback);
}

function exampleMarkdown(example) {
  const { rule } = example;
  const lines = [
    `### \`${rule.id}\`${rule.severity ? ` (${rule.severity})` : ""}`,
    "",
  ];

  if (rule.statement) {
    lines.push(rule.statement.replace(/\n/g, " "), "");
  }

  lines.push(
    `Labelled: **${KIND_LABEL[example.kind]} ${example.ordinal}/${example.kindTotal}** (${state.doc?.name ?? "catalog"}:${example.line})`,
    ""
  );

  example.parts.forEach((part) => {
    if (part.type === "code") {
      lines.push(`\`\`\`${part.lang}`, part.code, "```", "");
    } else {
      lines.push(part.text, "");
    }
  });

  return lines.join("\n").trimEnd();
}

function renderSummary() {
  const c = counts();
  const flagged = state.examples.filter((example) => state.verdicts.get(example.id)?.verdict === "bad");
  const disagreements = guessDisagreements();
  const guesses = guessStats();

  app.innerHTML = `
    <div class="page">
      <div class="summary-head">
        <div>
          <h1>Summary</h1>
          <div class="counts">
            <span class="c-ok"><b>${c.ok}</b> right</span>
            <span class="c-bad"><b>${c.bad}</b> flagged</span>
            <span><b>${c.pending}</b> left</span>
            <span>/ ${c.total} examples, ${state.rules.length} rules</span>
            ${guesses.made ? `<span class="c-guess"><b>${guesses.matched}/${guesses.made}</b> guesses matched</span>` : ""}
          </div>
        </div>
        <div class="summary-actions">
          <button class="btn btn-primary" type="button" id="back-review">← Back to cards</button>
          <button class="btn" type="button" id="copy-md">Copy report (Markdown)</button>
          <button class="btn" type="button" id="copy-json">Copy JSON</button>
          <button class="btn" type="button" id="download-md">Download .md</button>
        </div>
      </div>
      <div id="fallback"></div>
      <div class="summary-grid">
        <section>
          <p class="eyebrow">Rules · click a box to open that card</p>
          <div class="rule-table">
            ${bucketedRules()
              .map(
                (bucket) => `
              <div class="rule-row section-row"><span>${escapeHtml(bucket.name)}</span></div>
              ${bucket.rules
                .map(
                  (rule) => `
                <div class="rule-row">
                  <code title="${escapeHtml(rule.id)}">${escapeHtml(rule.id)}</code>
                  <div class="dots">
                    ${rule.examples
                      .map((example) => {
                        const verdict = state.verdicts.get(example.id)?.verdict;
                        const letter = example.kind === "correct" ? "C" : "I";

                        return `<button class="dot" type="button" data-index="${state.examples.indexOf(example)}" ${verdict ? `data-verdict="${verdict}"` : ""} title="${KIND_LABEL[example.kind]} ${example.ordinal}/${example.kindTotal}${verdict ? ` · ${VERDICT_LABEL[verdict]}` : " · not reviewed"}">${letter}</button>`;
                      })
                      .join("")}
                  </div>
                </div>`
                )
                .join("")}`
              )
              .join("")}
          </div>
        </section>
        <section>
          <p class="eyebrow">Flagged examples (${flagged.length})</p>
          <div class="issues">
            ${
              flagged.length
                ? flagged
                    .map((example) => {
                      const record = state.verdicts.get(example.id);

                      return `
                <div class="issue">
                  <div class="issue-top"><code>${escapeHtml(example.rule.id)}</code><span class="issue-kind">${KIND_LABEL[example.kind]} ${example.ordinal}/${example.kindTotal} · line ${example.line}</span></div>
                  ${record.tags?.length ? `<div class="tags">${record.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
                  ${record.comment ? `<blockquote>${escapeHtml(record.comment)}</blockquote>` : '<p class="empty-note">No comment.</p>'}
                  <button class="btn" type="button" data-edit="${state.examples.indexOf(example)}">Edit comment</button>
                </div>`;
                    })
                    .join("")
                : '<p class="empty-note">Nothing is flagged yet. Cards you swipe left show up here with their comments.</p>'
            }
          </div>
          ${
            disagreements.length
              ? `<p class="eyebrow" style="margin-top:24px">Your guess differed from the .md (${disagreements.length})</p>
          <div class="issues">
            ${disagreements
              .map((example) => {
                const record = state.verdicts.get(example.id);
                const outcome = record.verdict === "bad" ? "You flagged the label" : "You decided your guess was wrong";

                return `
                <div class="issue">
                  <div class="issue-top"><code>${escapeHtml(example.rule.id)}</code><span class="issue-kind">line ${example.line}</span></div>
                  <div>You said <strong>${KIND_LABEL[record.guess]}</strong> · the .md says <strong>${KIND_LABEL[example.kind]}</strong></div>
                  <p class="empty-note">${outcome}</p>
                  <button class="btn" type="button" data-open="${state.examples.indexOf(example)}">Open card</button>
                </div>`;
              })
              .join("")}
          </div>`
              : ""
          }
        </section>
      </div>
    </div>`;

  document.getElementById("back-review").addEventListener("click", () => {
    state.view = "review";
    render();
  });
  document.getElementById("copy-md").addEventListener("click", () => copyText(reportMarkdown(), "Report"));
  document.getElementById("copy-json").addEventListener("click", () => copyText(reportJson(), "JSON"));

  app.querySelectorAll(".dot").forEach((button) => {
    button.addEventListener("click", () => {
      state.filter = "all";
      state.cursor = Number(button.dataset.index);
      state.view = "review";
      render();
    });
  });

  app.querySelectorAll("[data-open]").forEach((button) => {
    button.addEventListener("click", () => {
      state.filter = "all";
      state.cursor = Number(button.dataset.open);
      state.view = "review";
      render();
    });
  });

  app.querySelectorAll("[data-edit]").forEach((button) => {
    button.addEventListener("click", () => {
      state.filter = "bad";
      state.cursor = Number(button.dataset.edit);
      state.view = "review";
      render();
      openSheet(state.examples[state.cursor]);
    });
  });

  document.getElementById("download-md").addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([reportMarkdown()], { type: "text/markdown" }));
    const link = document.createElement("a");

    link.href = url;
    link.download = `${state.doc.key.replace(/:/g, "-")}-review.md`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}

render();
</script>
</body>
</html>
