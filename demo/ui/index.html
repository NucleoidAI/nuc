<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1318;
        --panel: #161c24;
        --panel-2: #1d2530;
        --line: #283241;
        --text: #e8edf3;
        --muted: #8593a6;
        --faint: #566276;
        --accent: #4fd1a5;
        --accent-soft: rgba(79, 209, 165, 0.14);
        --warn: #f5b04c;
        --danger: #ef6b6b;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 Inter, system-ui, sans-serif;
        overflow: hidden;
      }

      button {
        font: inherit;
        color: inherit;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--muted);
      }

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        flex: none;
      }

      .dot.on {
        background: var(--accent);
      }

      .case {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }

      .meta {
        color: var(--muted);
        font: 12px "JetBrains Mono", monospace;
        white-space: nowrap;
      }

      .progress {
        height: 3px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }

      .progress > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.4s ease;
      }

      .flow {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: auto;
        scrollbar-width: none;
      }

      .item {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .item:hover {
        background: var(--panel);
      }

      .marker {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        border: 1.5px solid var(--faint);
        color: var(--faint);
      }

      .item.done .marker {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .item.done .title {
        color: var(--muted);
      }

      .item.next .title {
        color: var(--muted);
      }

      .item.later {
        opacity: 0.55;
      }

      .title {
        font-weight: 500;
      }

      .time {
        color: var(--faint);
        font: 11px "JetBrains Mono", monospace;
        padding-top: 3px;
      }

      .label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 8px 10px 2px;
      }

      .now {
        background: var(--panel);
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        padding: 14px;
        box-shadow: 0 0 0 4px var(--accent-soft);
        cursor: default;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .now .kicker {
        display: flex;
        justify-content: space-between;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 600;
      }

      .now .title {
        font-size: 18px;
        font-weight: 600;
      }

      .now .note {
        color: #c3ccd8;
        white-space: pre-wrap;
      }

      .waits {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .wait {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-2);
        border-radius: 8px;
        padding: 7px 9px;
        font: 12px "JetBrains Mono", monospace;
        color: var(--muted);
        min-width: 0;
      }

      .wait span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn);
        flex: none;
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }

      .finished {
        text-align: center;
        padding: 22px 14px;
      }

      .finished .title {
        font-size: 20px;
      }

      .foot {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .controls {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .controls .grow {
        flex: 1;
      }

      .controls .primary {
        background: var(--accent);
        color: #06251a;
        border-color: var(--accent);
        font-weight: 600;
      }

      select {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        min-width: 0;
        max-width: 100%;
      }

      .ticker {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font: 11px "JetBrains Mono", monospace;
        color: var(--faint);
        max-height: 110px;
        overflow: hidden;
      }

      .ticker div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ticker .hit {
        color: var(--accent);
      }

      .alert {
        color: var(--danger);
        font-size: 12px;
      }

      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
      }

      .empty .pick {
        text-align: left;
        padding: 12px;
      }

      .empty .pick small {
        display: block;
        color: var(--muted);
        margin-top: 2px;
      }

      body.horizontal .app {
        flex-direction: row;
        align-items: stretch;
        padding: 10px 14px;
      }

      body.horizontal .side {
        width: 190px;
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
      }

      body.horizontal .flow {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      body.horizontal .time {
        display: none;
      }

      body.horizontal .label {
        display: none;
      }

      body.horizontal .item {
        flex: 0 1 170px;
        min-width: 110px;
        grid-template-columns: 22px 1fr;
      }

      body.horizontal .now {
        flex: 1 1 460px;
        max-width: 600px;
        min-width: 280px;
        padding: 10px 14px;
        gap: 6px;
        max-height: 100%;
        overflow: hidden;
      }

      body.horizontal .now .title {
        font-size: 16px;
      }

      body.horizontal .now .note {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      body.horizontal .arrow {
        color: var(--faint);
        flex: none;
      }

      body.horizontal .foot {
        width: 240px;
        flex: none;
        justify-content: center;
      }

      body.horizontal .ticker {
        max-height: 60px;
      }

      .arrow {
        display: none;
      }

      body.horizontal .arrow {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>
    <script>
      const app = document.getElementById("app");
      const params = new URLSearchParams(location.search);
      let state = null;
      let cases = [];
      let error = null;
      let socket;
      let skew = 0;
      let focused = null;

      function connect() {
        socket = new WebSocket(`${location.origin.replace(/^http/, "ws")}/ws`);
        socket.onmessage = (message) => {
          const data = JSON.parse(message.data);

          if (data.kind === "state") {
            state = data.state;
            skew = Date.now() - state.now;
            error = null;
          } else if (data.kind === "cases") {
            cases = data.cases;
          } else if (data.kind === "error") {
            error = data.message;
          }

          render();
        };
        socket.onclose = () => setTimeout(connect, 1000);
      }

      function send(action, body = {}) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ action, ...body }));
        }
      }

      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function clock(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(total / 60);
        const s = String(total % 60).padStart(2, "0");

        return `${m}:${s}`;
      }

      function now() {
        return Date.now() - skew;
      }

      function orientation() {
        const forced = params.get("orientation");

        if (forced) {
          return forced;
        }

        const position = state?.indicator?.position ?? state?.def?.indicator?.position;

        if (position === "top" || position === "bottom") {
          return "horizontal";
        }

        if (position === "left" || position === "right") {
          return "vertical";
        }

        return innerWidth > innerHeight * 1.6 ? "horizontal" : "vertical";
      }

      function describe(trigger) {
        if (trigger.label) {
          return trigger.label;
        }

        if ("delay" in trigger) {
          const entered = state.enteredAt[state.index] ?? now();
          const left = trigger.delay - (now() - entered);

          return `auto in ${clock(left + 999)}`;
        }

        const where = Object.entries(trigger.where ?? {})
          .map(([key, condition]) => {
            if (condition === null || typeof condition !== "object") {
              return `${key}=${condition}`;
            }

            const [op, value] = Object.entries(condition)[0] ?? [];

            return `${key} ${op} ${Array.isArray(value) ? value.join("|") : value}`;
          })
          .join(", ");

        return where ? `${trigger.event} · ${where}` : trigger.event;
      }

      function item(step, index, kind) {
        const entered = state.enteredAt[index];
        const exited = state.enteredAt[index + 1];
        const time = kind === "done" && entered && exited ? clock(exited - entered) : "";

        return `<div class="item ${kind}" data-goto="${index}">
          <div class="marker">${kind === "done" ? "✓" : index + 1}</div>
          <div class="title">${esc(step.title)}</div>
          <div class="time">${time}</div>
        </div>`;
      }

      function current(step, index, total) {
        const waits = step.advance?.length
          ? step.advance
              .map((trigger) => `<div class="wait"><span class="pulse"></span><span>${esc(describe(trigger))}</span></div>`)
              .join("")
          : `<div class="wait"><span class="pulse"></span><span>Press → to continue</span></div>`;
        const entered = state.enteredAt[index];

        return `<div class="now" id="now">
          <div class="kicker"><span>Now · ${index + 1}/${total}</span><span>${entered ? clock(now() - entered) : ""}</span></div>
          <div class="title">${esc(step.title)}</div>
          ${step.note ? `<div class="note">${esc(step.note)}</div>` : ""}
          <div class="waits">${waits}</div>
        </div>`;
      }

      function flow() {
        const steps = state.def.steps;
        const index = state.index;
        const horizontal = orientation() === "horizontal";

        if (state.finished) {
          const done = steps.map((step, i) => item(step, i, "done")).join("");

          return `${horizontal ? "" : `<div class="label">Done</div>`}${horizontal ? "" : done}
            <div class="now finished" id="now"><div class="kicker" style="justify-content:center"><span>Complete</span></div>
            <div class="title">That's the demo 🎉</div>
            <div class="note">${clock(state.enteredAt[steps.length] - state.startedAt)} total</div></div>`;
        }

        const past = steps.slice(0, index).map((step, i) => item(step, i, "done"));
        const upcoming = steps.slice(index + 1).map((step, i) => item(step, index + 1 + i, i === 0 ? "next" : "later"));
        const arrow = `<div class="arrow">→</div>`;

        if (horizontal) {
          return [
            ...past.slice(-2).flatMap((html) => [html, arrow]),
            current(steps[index], index, steps.length),
            ...upcoming.slice(0, 2).flatMap((html) => [arrow, html]),
          ].join("");
        }

        return `${past.length ? `<div class="label">Done</div>${past.join("")}` : ""}
          <div class="label">Now</div>
          ${current(steps[index], index, steps.length)}
          ${upcoming.length ? `<div class="label">Next</div>${upcoming.join("")}` : ""}`;
      }

      function ticker() {
        return state.log
          .slice(0, 5)
          .map((entry) => {
            const time = new Date(entry.at).toLocaleTimeString([], { hour12: false });

            return `<div class="${entry.matched ? "hit" : ""}">${time} ${entry.matched ? "▸" : "·"} ${esc(entry.type)}${entry.simulated ? " (sim)" : ""}</div>`;
          })
          .join("");
      }

      function picker() {
        const options = cases
          .map((c) => `<option value="${esc(c.file)}" ${c.file === state?.file ? "selected" : ""}>${esc(c.name)}</option>`)
          .join("");

        return `<select id="case">${state?.file ? "" : `<option value="">Choose a demo…</option>`}${options}</select>`;
      }

      function render() {
        if (!state) {
          return;
        }

        const horizontal = orientation() === "horizontal";

        document.body.classList.toggle("horizontal", horizontal);

        const alerts = [
          !state.connected && `Event bus offline (${state.eventUrl})`,
          state.layoutError && `Layout: ${state.layoutError}`,
          error,
        ].filter(Boolean);

        if (!state.def) {
          app.innerHTML = `<div class="head"><span class="dot ${state.connected ? "on" : ""}"></span><span class="case">Choose a demo</span></div>
            <div class="empty">${cases
              .map((c) => `<button class="pick" data-load="${esc(c.file)}">${esc(c.name)}<small>${c.steps} steps${c.description ? ` · ${esc(c.description)}` : ""}</small></button>`)
              .join("")}</div>
            ${alerts.map((a) => `<div class="alert">${esc(a)}</div>`).join("")}`;
          return;
        }

        const total = state.def.steps.length;
        const progress = state.finished ? 100 : (state.index / total) * 100;
        const elapsed = clock((state.finished ? state.enteredAt[total] : now()) - state.startedAt);

        const head = `<div class="head"><span class="dot ${state.connected ? "on" : ""}" title="${state.connected ? "Event bus connected" : "Event bus offline"}"></span>
          <span class="case">${esc(state.def.name)}</span><span class="meta">${elapsed}</span></div>
          <div class="progress"><div style="width:${progress}%"></div></div>`;

        const controls = `<div class="controls">
          <button data-act="prev" title="Previous (←)">←</button>
          <button class="primary grow" data-act="next" title="Next (→ / Space)">${state.finished ? "Done" : "Next →"}</button>
          <button data-act="restart" title="Restart (R)">↺</button>
          <button data-act="arrange" title="Re-apply layout (L)">⊞</button>
        </div>`;

        const foot = `<div class="foot">${controls}${picker()}
          <div class="ticker">${ticker()}</div>
          ${alerts.map((a) => `<div class="alert">${esc(a)}</div>`).join("")}</div>`;

        app.innerHTML = horizontal
          ? `<div class="side">${head}</div><div class="flow" id="flow">${flow()}</div>${foot}`
          : `${head}<div class="flow" id="flow">${flow()}</div>${foot}`;

        const key = `${state.file}:${state.index}:${state.finished}:${horizontal}`;

        if (key !== focused) {
          focused = key;
          document.getElementById("now")?.scrollIntoView({ block: "center", inline: "center" });
        }
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-act],[data-goto],[data-load]");

        if (!target) {
          return;
        }

        if (target.dataset.act) {
          send(target.dataset.act);
        } else if (target.dataset.goto) {
          send("goto", { index: Number(target.dataset.goto) });
        } else if (target.dataset.load) {
          send("load", { file: target.dataset.load });
        }
      });

      app.addEventListener("change", (event) => {
        if (event.target.id === "case" && event.target.value) {
          send("load", { file: event.target.value });
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.tagName === "SELECT") {
          return;
        }

        const actions = { ArrowRight: "next", " ": "next", ArrowLeft: "prev", r: "restart", l: "arrange" };
        const action = actions[event.key];

        if (action) {
          event.preventDefault();
          send(action);
        }
      });

      addEventListener("resize", render);
      setInterval(() => {
        if (state?.def && !state.finished && document.activeElement?.id !== "case") {
          render();
        }
      }, 1000);
      connect();
    </script>
  </body>
</html>
