    container_name: nucleoid-docs
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nucleoid-docs.rule=Host(`docs.nucleoid.com`)'
      - 'traefik.http.routers.nucleoid-docs.entrypoints=websecure'
      - 'traefik.http.routers.nucleoid-docs.tls=true'
      - 'traefik.http.routers.nucleoid-docs.tls.certresolver=default'
      - 'traefik.http.services.nucleoid-docs.loadbalancer.server.port=3000'
      - 'traefik.http.routers.nucleoid-docs-http.rule=Host(`docs.nucleoid.com`)'
      - 'traefik.http.routers.nucleoid-docs-http.entrypoints=web'
      - 'traefik.http.routers.nucleoid-docs-http.middlewares=redirect-to-https'

  greycollar-land:
    image: canmingir/greycollar-land:latest
    container_name: greycollar-land
    restart: unless-stopped
    env_file:
      - /home/ubuntu/apps/env/env.greycollar
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.greycollar-land.rule=Host(`dashboard.land.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-land.entrypoints=websecure'
      - 'traefik.http.routers.greycollar-land.tls=true'
      - 'traefik.http.routers.greycollar-land.tls.certresolver=default'
      - 'traefik.http.services.greycollar-land.loadbalancer.server.port=3000'
      - 'traefik.http.routers.greycollar-land-http.rule=Host(`dashboard.land.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-land-http.entrypoints=web'

  inmemory-queue:
    image: canmingir/inmemory-queue-land:latest
    container_name: inmemory_queue
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - traefik-network

  greycollar-docs:
    image: canmingir/greycollar.docs-live:latest
    container_name: greycollar-docs
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.greycollar-docs.rule=Host(`docs.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-docs.entrypoints=websecure'
      - 'traefik.http.routers.greycollar-docs.tls=true'
      - 'traefik.http.routers.greycollar-docs.tls.certresolver=default'
      - 'traefik.http.services.greycollar-docs.loadbalancer.server.port=3000'
      - 'traefik.http.routers.greycollar-docs-http.rule=Host(`docs.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-docs-http.entrypoints=web'
      - 'traefik.http.routers.greycollar-docs-http.middlewares=redirect-to-https'

  greycollar-ai-website:
    image: canmingir/greycollar.ai-live:latest
    container_name: greycollar-ai-website
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.greycollar-ai-website.rule=Host(`website.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-ai-website.entrypoints=websecure'
      - 'traefik.http.routers.greycollar-ai-website.tls=true'
      - 'traefik.http.routers.greycollar-ai-website.tls.certresolver=default'
      - 'traefik.http.services.greycollar-ai-website.loadbalancer.server.port=5173'
      - 'traefik.http.routers.greycollar-ai-website-http.rule=Host(`website.greycollar.ai`)'
      - 'traefik.http.routers.greycollar-ai-website-http.entrypoints=web'
      - 'traefik.http.routers.greycollar-ai-website-http.middlewares=redirect-to-https'

  ide-nucleoid-com-live:
    image: canmingir/ide.nucleoid.com-land:latest
    container_name: ide-nucleoid-com-live
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.ide-live.rule=Host(`ide.nucleoid.com`)'
      - 'traefik.http.routers.ide-live.entrypoints=websecure'
      - 'traefik.http.routers.ide-live.tls=true'
      - 'traefik.http.routers.ide-live.tls.certresolver=default'
      - 'traefik.http.services.ide-live.loadbalancer.server.port=3000'
      - 'traefik.http.routers.ide-live-http.rule=Host(`ide.nucleoid.com`)'
      - 'traefik.http.routers.ide-live-http.entrypoints=web'
      - 'traefik.http.routers.ide-live-http.middlewares=redirect-to-https'

  ide-nucleoid-com-land:
    image: canmingir/ide.nucleoid.com-land:latest
    container_name: ide-nucleoid-com-land
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.ide-land.rule=Host(`ide.nuc.land`)'
      - 'traefik.http.routers.ide-land.entrypoints=websecure'
      - 'traefik.http.routers.ide-land.tls=true'
      - 'traefik.http.routers.ide-land.tls.certresolver=default'
      - 'traefik.http.services.ide-land.loadbalancer.server.port=3000'
      - 'traefik.http.routers.ide-land-http.rule=Host(`ide.nuc.land`)'
      - 'traefik.http.routers.ide-land-http.entrypoints=web'
      - 'traefik.http.routers.ide-land-http.middlewares=redirect-to-https'

networks:
  traefik-network:
    external: false
  elk-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
  app-logs:
    driver: local
  filebeat-data:
    driver: local
  prometheus-land-data:
  grafana-land-data:
  postgres-data: