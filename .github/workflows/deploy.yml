name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Service name (e.g., greycollar, communication, prometheus, grafana)"
      environment:
        required: true
        type: string
        description: "Environment: live or land"
      context_path:
        required: false
        type: string
        default: "."
        description: "Docker build context path"
      install_dependencies:
        required: false
        type: boolean
        default: false
        description: "Whether to run npm ci"
      dependency_path:
        required: false
        type: string
        default: "."
        description: "Path where to run npm ci"
      run_lint:
        required: false
        type: boolean
        default: false
        description: "Whether to run linting"
      run_build:
        required: false
        type: boolean
        default: false
        description: "Whether to run npm build"
      setup_config:
        required: false
        type: boolean
        default: false
        description: "Whether to setup config files for the environment"
      docker_username:
        required: false
        type: string
        description: "Docker username"
        default: canmingir
      config_paths:
        required: false
        type: string
        description: 'Optional: Comma-separated paths for multiple configs (e.g., "./dashboard,./api")'
      setup_version:
        required: false
        type: boolean
        default: false
        description: "Whether to setup version.json"
      image_tag:
        required: false
        type: string
        description: "Image tag"
        default: latest
    secrets:
      DOCKER_ACCESS_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve_tag
        run: |
          TAG="${{ inputs.image_tag }}"
          # Strip leading 'v' or 'V' prefix for semver-only Docker tags
          TAG="${TAG#v}"
          TAG="${TAG#V}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set config files
        if: ${{ inputs.setup_config }}
        run: |
          CONFIG_PATHS="${{ inputs.config_paths }}"

          if [ -z "$CONFIG_PATHS" ]; then
            CONFIG_PATHS="."
          fi

          IFS=',' read -ra PATHS <<< "$CONFIG_PATHS"
          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)  # Trim whitespace
            
            if [ -f "${path}/config.${{ inputs.environment }}.js" ]; then
              cp ${path}/config.${{ inputs.environment }}.js ${path}/config.js
              echo "✓ Copied JS config for ${path}"
            fi
            
            if [ -f "${path}/config.${{ inputs.environment }}.ts" ]; then
              cp ${path}/config.${{ inputs.environment }}.ts ${path}/config.ts
              echo "✓ Copied TS config for ${path}"
            fi
          done

      - name: Update version.json
        if: ${{ inputs.setup_version }}
        run: |
          CONFIG_PATHS="${{ inputs.config_paths }}"

          if [ -z "$CONFIG_PATHS" ]; then
            CONFIG_PATHS="."
          fi

          IFS=',' read -ra PATHS <<< "$CONFIG_PATHS"
          FIRST_PATH=$(echo "${PATHS[0]}" | xargs)

          if [ -d "${FIRST_PATH}/src" ]; then
            echo "{ \"version\": \"${{ steps.resolve_tag.outputs.tag }}\" }" > ${FIRST_PATH}/src/version.json
            echo "✓ Updated version.json in ${FIRST_PATH}/src"
          fi

      - name: Install Dependencies
        if: ${{ inputs.install_dependencies }}
        run: |
          cd ${{ inputs.dependency_path }}
          npm ci

      - name: Check lint
        if: ${{ inputs.run_lint }}
        run: npm run lint

      - name: Build
        if: ${{ inputs.run_build }}
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_username || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Ensure Docker Hub repository is private
        env:
          DOCKER_NAMESPACE: ${{ inputs.docker_username || secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_REPOSITORY: ${{ inputs.service_name }}-${{ inputs.environment }}
        run: |
          set -euo pipefail

          AUTH_PAYLOAD=$(printf '{"username":"%s","password":"%s"}' "$DOCKER_NAMESPACE" "$DOCKER_TOKEN")
          JWT_TOKEN=$(curl -fsSL \
            -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "$AUTH_PAYLOAD" | jq -r '.token')

          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "Failed to get Docker Hub JWT token."
            exit 1
          fi

          REPO_URL="https://hub.docker.com/v2/repositories/$DOCKER_NAMESPACE/$DOCKER_REPOSITORY/"
          REPO_FILE="$(mktemp)"
          trap 'rm -f "$REPO_FILE"' EXIT
          STATUS_CODE=$(curl -sS -o "$REPO_FILE" -w "%{http_code}" \
            -H "Authorization: JWT $JWT_TOKEN" \
            "$REPO_URL")

          if [ "$STATUS_CODE" = "404" ]; then
            echo "Repository not found. Creating as private: $DOCKER_NAMESPACE/$DOCKER_REPOSITORY"
            CREATE_PAYLOAD=$(printf '{"namespace":"%s","name":"%s","is_private":true}' "$DOCKER_NAMESPACE" "$DOCKER_REPOSITORY")
            curl -fsSL \
              -X POST "https://hub.docker.com/v2/repositories/" \
              -H "Authorization: JWT $JWT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$CREATE_PAYLOAD" >/dev/null
            echo "Private repository created."
          elif [ "$STATUS_CODE" = "200" ]; then
            echo "Repository already exists. Skipping create."
          else
            echo "Failed to query Docker Hub repository. HTTP status: $STATUS_CODE"
            cat "$REPO_FILE" || true
            exit 1
          fi


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ inputs.docker_username || secrets.DOCKER_USERNAME }}/${{ inputs.service_name }}-${{ inputs.environment }}:${{ steps.resolve_tag.outputs.tag }}
          context: ${{ inputs.context_path }}
