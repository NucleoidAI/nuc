name: GreyCollar
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "api/**"
      - "mcp/**"
      - ".github/workflows/greycollar.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - land
        default: "land"
jobs:
  greycollar:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: greycollar
      environment: land
      context_path: .
      config_paths: "./dashboard,./api"
      install_dependencies: true
      dependency_path: .
      build_command: bun run build:dashboard && bun run build:api
      run_lint: true
      run_build: true
      setup_config: true
      setup_version: true
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      DOCKER_USERNAME: canmingir
