name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Service name (e.g., greycollar, communication, prometheus, grafana)"
      environment:
        required: true
        type: string
        description: "Environment: live or land"
      context_path:
        required: false
        type: string
        default: "."
        description: "Docker build context path"
      install_dependencies:
        required: false
        type: boolean
        default: false
        description: "Whether to run bun install"
      dependency_path:
        required: false
        type: string
        default: "."
        description: "Path where to run bun install"
      run_lint:
        required: false
        type: boolean
        default: false
        description: "Whether to run linting"
      run_build:
        required: false
        type: boolean
        default: false
        description: "Whether to run bun build"
      build_command:
        required: false
        type: string
        default: "bun run build"
        description: "Command to run build"
      setup_config:
        required: false
        type: boolean
        default: false
        description: "Whether to setup config files for the environment"
      docker_username:
        required: false
        type: string
        description: "Docker username"
        default: canmingir
      config_paths:
        required: false
        type: string
        description: 'Optional: Comma-separated paths for multiple configs (e.g., "./dashboard,./api")'
      setup_version:
        required: false
        type: boolean
        default: false
        description: "Whether to setup version.json"
      image_tag:
        required: false
        type: string
        description: "Image tag"
        default: latest
      hf_dataset_namespace:
        required: false
        type: string
        default: ""
        description: "Hugging Face user/org owning the dataset repos; set to enable the dataset prefetch"
    secrets:
      DOCKER_ACCESS_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false
      HF_TOKEN:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve_tag
        run: |
          TAG="${{ inputs.image_tag }}"
          # Strip leading 'v' or 'V' prefix for semver-only Docker tags
          TAG="${TAG#v}"
          TAG="${TAG#V}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set config files
        if: ${{ inputs.setup_config }}
        run: |
          CONFIG_PATHS="${{ inputs.config_paths }}"

          if [ -z "$CONFIG_PATHS" ]; then
            CONFIG_PATHS="."
          fi

          IFS=',' read -ra PATHS <<< "$CONFIG_PATHS"
          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)  # Trim whitespace
            
            if [ -f "${path}/config.${{ inputs.environment }}.js" ]; then
              cp ${path}/config.${{ inputs.environment }}.js ${path}/config.js
              echo "✓ Copied JS config for ${path}"
            fi
            
            if [ -f "${path}/config.${{ inputs.environment }}.ts" ]; then
              cp ${path}/config.${{ inputs.environment }}.ts ${path}/config.ts
              echo "✓ Copied TS config for ${path}"
            fi
          done

      - name: Update version.json
        if: ${{ inputs.setup_version }}
        run: |
          CONFIG_PATHS="${{ inputs.config_paths }}"

          if [ -z "$CONFIG_PATHS" ]; then
            CONFIG_PATHS="."
          fi

          IFS=',' read -ra PATHS <<< "$CONFIG_PATHS"
          FIRST_PATH=$(echo "${PATHS[0]}" | xargs)

          if [ -d "${FIRST_PATH}/src" ]; then
            echo "{ \"version\": \"${{ steps.resolve_tag.outputs.tag }}\" }" > ${FIRST_PATH}/src/version.json
            echo "✓ Updated version.json in ${FIRST_PATH}/src"
          fi

      - name: Setup Bun
        if: ${{ inputs.install_dependencies || inputs.run_lint || inputs.run_build }}
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        if: ${{ inputs.install_dependencies }}
        run: |
          cd ${{ inputs.dependency_path }}
          bun install

      - name: Check lint
        if: ${{ inputs.run_lint }}
        run: bun run lint

      - name: Verify dataset credentials
        if: ${{ inputs.run_build && inputs.hf_dataset_namespace != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty but hf_dataset_namespace is set."
            echo "The dataset prefetch would be skipped and the image would ship without api/src/dataset/**.json."
            exit 1
          fi

      - name: Build
        if: ${{ inputs.run_build }}
        env:
          HF_DATASET_NAMESPACE: ${{ inputs.hf_dataset_namespace }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_STRICT: ${{ inputs.hf_dataset_namespace != '' && '1' || '0' }}
        run: ${{ inputs.build_command }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_username || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ inputs.docker_username || secrets.DOCKER_USERNAME }}/${{ inputs.service_name }}-${{ inputs.environment }}:${{ steps.resolve_tag.outputs.tag }}
          context: ${{ inputs.context_path }}
