name: greycollar-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-greycollar
    pull_policy: always
    restart: unless-stopped
    environment:
      - POSTGRES_USER=greyadmin
      - POSTGRES_PASSWORD=eyuTSfZ4vJmxWfDz
      - POSTGRES_DB=greycollar-land
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - greycollar-network
    ports:
      - "5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    pull_policy: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - greycollar-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    pull_policy: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - greycollar-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana-init:
    image: curlimages/curl:latest
    container_name: kibana-init
    volumes:
      - ./kibana/saved-objects.ndjson:/saved-objects/saved-objects.ndjson:ro
      - ./kibana/import-saved-objects.sh:/import-saved-objects.sh:ro
    environment:
      - KIBANA_URL=http://kibana:5601
    networks:
      - greycollar-network
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/import-saved-objects.sh"]
    restart: "no"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    pull_policy: always
    user: root
    restart: unless-stopped
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
      - app-logs:/var/log/apps:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    networks:
      - greycollar-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: filebeat -e -strict.perms=false

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway-land
    pull_policy: always
    restart: unless-stopped
    networks:
      - greycollar-network
    ports:
      - "9091:9091"

  prometheus:
    image: canmingir/prometheus-land:0.0.7
    container_name: prometheus-land
    pull_policy: always
    restart: unless-stopped
    networks:
      - greycollar-network
    volumes:
      - prometheus-land-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: canmingir/grafana-land:0.0.7
    container_name: grafana-land
    pull_policy: always
    restart: unless-stopped
    networks:
      - greycollar-network
    volumes:
      - grafana-land-data:/var/lib/grafana
    ports:
      - "3001:3000"

  communication:
    image: canmingir/communication-land:0.0.7
    container_name: communication-land
    pull_policy: always
    restart: unless-stopped
    env_file:
      - env.greycollar  
    networks:
      - greycollar-network
    volumes:
      - ./config.communication.ts:/app/config.ts:ro
    ports:
      - "3003:3003"
    depends_on:
      - inmemory

  greycollar:
    image: canmingir/greycollar-land:0.0.7
    container_name: greycollar-land
    pull_policy: always
    restart: unless-stopped
    env_file:
      - env.greycollar
    networks:
      - greycollar-network
    volumes:
      - ./config.api.ts:/app/api/config.ts:ro
      - ./config.dashboard.js:/app/dist/config.js:ro
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - inmemory

  inmemory:
    image: canmingir/inmemory-queue-land:0.0.7
    container_name: inmemory_queue
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - greycollar-network

networks:
  greycollar-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
  filebeat-data:
    driver: local
  app-logs:
    driver: local
  prometheus-land-data:
  grafana-land-data:
  postgres-data:
