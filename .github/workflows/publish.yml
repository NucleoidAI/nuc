name: Publish

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          (cd api && bun install --frozen-lockfile)
          (cd mcp && bun install --frozen-lockfile)

      - name: Bump version
        id: version
        run: |
          npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: bun run build:package

      - name: Publish @nucleoidai/nuc
        run: npm publish ./npm/nuc --access public

      - name: Publish @nucleoidai/nuc-dashboard
        run: npm publish ./npm/nuc-dashboard --access public

      - name: Push version
        run: |
          git commit -am "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push
