name: Server Dashboard
on:
  push:
    branches: [main]
    paths:
      - "server-dashboard/**"
      - ".github/workflows/server-dashboard.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - land
        default: "land"
jobs:
  server-dashboard:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: server-dashboard
      environment: land
      context_path: ./server-dashboard
      install_dependencies: true
      dependency_path: server-dashboard
      run_build: true
      build_command: bun run build:server-dashboard
      setup_config: true
      config_paths: "./server-dashboard"
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      DOCKER_USERNAME: canmingir
