name: Semgrep Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        env:
          BASELINE_COMMIT: >-
            ${{ github.event.pull_request.base.sha || github.event.before ||
            'HEAD^' }}
        run: >-
          semgrep scan --config auto --error --baseline-commit
          "$BASELINE_COMMIT" .
